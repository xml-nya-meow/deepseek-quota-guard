name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_portable:
        description: Build and smoke-test the portable candidate
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  tests:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/browser-runtime
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13.17'
          architecture: x64
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Install Chromium for isolated HTML tests
        run: python -m playwright install chromium
      - name: Run offline tests
        run: python -B -m unittest discover -s tests -v

  portable:
    if: github.event_name == 'workflow_dispatch' && inputs.build_portable
    needs: tests
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13.17'
          architecture: x64
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Build a fresh portable candidate
        run: python build.py --install-browser --output dist/DeepSeekQuotaManager-win-x64
      - name: Smoke-test without a platform account
        shell: pwsh
        run: |
          $executable = Join-Path $PWD 'dist/DeepSeekQuotaManager-win-x64/额度管理.exe'
          $smokeRoot = Join-Path $env:RUNNER_TEMP ('quota-smoke-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          foreach ($mode in @('smoke', 'browser-smoke')) {
            $dataFolder = Join-Path $smokeRoot $mode
            $arguments = @('--data-dir', ('"' + $dataFolder + '"'), ('--' + $mode))
            $process = Start-Process -FilePath $executable -ArgumentList $arguments -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(60000)) {
              $process.Kill($true)
              throw "Portable $mode timed out."
            }
            if ($process.ExitCode -ne 0) { throw "Portable $mode failed." }
          }
          $resultPath = Join-Path $smokeRoot 'browser-smoke/browser-smoke.json'
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if ($result.browser_started -ne $true) { throw 'Bundled Chromium did not start.' }
      - name: Package candidate and checksum
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'dist/DeepSeekQuotaManager-win-x64'
          $unexpected = Get-ChildItem -LiteralPath $bundle -Recurse -File | Where-Object {
            $_.Name -match '^(管理设置\.json|人员额度\.xlsx|状态\.db(?:-.*)?|\.运行锁|\.初始化中|browser-smoke\.json)$' -or
            $_.Name -match '^运行(日志|摘要)-'
          }
          if ($unexpected) { throw 'Application data found in the portable directory.' }
          $archive = Join-Path $PWD 'dist/DeepSeekQuotaManager-windows-x64.zip'
          Compress-Archive -LiteralPath $bundle -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DeepSeekQuotaManager-windows-x64.zip" | Set-Content -LiteralPath ($archive + '.sha256') -Encoding ascii
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: DeepSeekQuotaManager-windows-x64-candidate
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
